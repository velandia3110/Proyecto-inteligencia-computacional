name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      kernel:
        description: "Construir la imagen de Lean y correr las pruebas contra el kernel real"
        type: boolean
        default: false

jobs:
  # Rapido: sin Lean ni API, con REPL y LLM falsos.
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install jsonschema "langgraph>=0.2" numpy faiss-cpu
      - run: python tests/test_verify.py
      - run: python tests/test_pipeline.py
      - run: python tests/test_graph.py

  # Lento (~20 min, varios GB): solo a mano. Es el que dice si los veredictos de
  # verdad se parecen a los fabricados.
  kernel:
    if: github.event_name == 'workflow_dispatch' && inputs.kernel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t mathagents-lean:v4.15.0 lean/
      - run: docker run --rm -v "$PWD:/work" -w /work mathagents-lean:v4.15.0 python3 -m src.verify --smoke
      - run: docker run --rm -v "$PWD:/work" -w /work mathagents-lean:v4.15.0 python3 tests/test_kernel.py
